# Federasyon siteleri tasarim degistirdiginde duyuru kaynagi kaybolur.
# Bu is akisi haftada bir kaynaklari yeniden kesfeder ve degisiklik varsa PR acar.
name: Kaynak kesfi

on:
  schedule:
    - cron: "20 4 * * 1"      # her pazartesi 04:20 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  kesfet:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Kaynaklari yeniden kesfet
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/discover_sources.py

      - name: Degisiklik varsa PR ac
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "kaynak kesfi: sources.json guncellendi"
          branch: kaynak-kesfi
          title: "Federasyon kaynaklari guncellendi"
          body: |
            Haftalik kesif calisti ve `backend/data/sources.json` degisti.
            Birlestirmeden once tarama denemesi yapin:
            `python backend/scripts/ci_update.py`
          add-paths: backend/data/sources.json
