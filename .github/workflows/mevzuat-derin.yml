# Mevzuat belgelerinin icerigini gunluk dogrular.
# Saatlik tarama yalnizca listeye bakar (ucuz); bu is akisi her belgeyi indirip
# parmak izini karsilastirir, boylece ayni adreste sessizce guncellenen
# talimatlar da yakalanir.
name: Mevzuat derin kontrol

on:
  schedule:
    - cron: "40 3 * * *"        # her gun 03:40 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarama                 # saatlik tarama ile ayni kuyruk
  cancel-in-progress: false

jobs:
  derin:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Belgeleri dogrula
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_rules.py --deep

      - name: Ciktilari yenile
        working-directory: backend
        run: python scripts/build_site.py

      - name: Degisiklikleri yayinla
        run: |
          git config user.name "antrenor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "mevzuatta degisiklik yok"
          else
            git commit -m "mevzuat derin kontrol"
            git pull --rebase --autostash origin main || true
            git push
          fi
