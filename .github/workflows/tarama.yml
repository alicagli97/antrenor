# Federasyon duyurularini saatte bir tarar ve docs/ altina JSON olarak yayinlar.
# Sonuc GitHub Pages uzerinden mobil uygulamaya sunulur.
#
# NOT: GitHub, 60 gun boyunca depoda kullanici etkinligi olmayan depolarda
# zamanlanmis is akislarini otomatik devre disi birakir. Bu is akisinin kendi
# bot commit'leri bu sayaci sifirlamaz. Iki ayda bir depoya elle bir commit
# atmak (veya Actions sekmesinden is akisini yeniden etkinlestirmek) yeterlidir.
name: Duyuru taramasi

on:
  schedule:
    # Her saat basi 7. dakikada (GitHub sirasi yogunsa gecikebilir)
    - cron: "7 * * * *"
  workflow_dispatch:          # elle calistirma
  push:
    branches: [main]
    paths:
      - "backend/app/scraper/**"
      - "backend/scripts/ci_update.py"
      - ".github/workflows/tarama.yml"

permissions:
  contents: write             # sonuclari depoya yazabilmek icin

concurrency:
  group: tarama
  cancel-in-progress: false   # yarim kalan tur veriyi bozmasin

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # secrets baglami adim kosullarinda dogrudan kullanilamadigi icin env'e tasiyoruz
    env:
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bagimliliklari kur
        run: pip install -r backend/requirements.txt

      - name: Tarayici onbellegi
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Bildirim anahtarini yaz
        if: env.FCM_SERVICE_ACCOUNT != ''
        run: |
          mkdir -p backend/secrets
          # Degeri kabuga gomek yerine ortam degiskeninden yaziyoruz (JSON tirnaklari bozulmasin)
          printf '%s' "$FCM_SERVICE_ACCOUNT" > backend/secrets/fcm.json
          echo "PUSH_ENABLED=1" >> "$GITHUB_ENV"
          echo "FCM_CREDENTIALS_JSON=$PWD/backend/secrets/fcm.json" >> "$GITHUB_ENV"

      - name: Faaliyet takvimlerini kontrol et
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_calendars.py

      - name: Yarisma kurallarini kontrol et
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_rules.py

      - name: Federasyonlari tara
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          SCRAPE_CONCURRENCY: "6"
        run: python scripts/ci_update.py

      - name: Statik sayfalari uret
        working-directory: backend
        run: python scripts/build_site.py

      - name: Anahtari sil
        if: always()
        run: rm -f backend/secrets/fcm.json

      - name: Degisiklikleri yayinla
        run: |
          git config user.name "antrenor-bot"
          git config user.email "actions@users.noreply.github.com"
          cd backend && python scripts/publish.py "duyuru guncellemesi"
