# Antrenör — üretim yığını
#   caddy   : otomatik HTTPS + ters vekil
#   api     : REST uçları (tarama kapalı)
#   worker  : 30 dakikada bir federasyonları tarar, bildirimi gönderir
#   db      : PostgreSQL
#
# Kullanım:  docker compose --env-file .env.production up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antrenor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?parola gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-antrenor}
      TZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antrenor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENABLE_SCHEDULER: "0"          # tarama worker'da
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/sources.json:/app/data/sources.json:ro
      - ./secrets:/app/secrets:ro
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: ["python", "scripts/worker.py"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?alan adi gerekli}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
